name: Release dry-run

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'README.ja.md'
  workflow_dispatch:
  push:
    branches:
      - 'feature/phase-5.0-release-hardening'
      - 'feature/phase-5.1-v1-release-validation'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --no-restore
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

  ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore UI tests
        run: dotnet restore tests/MinecraftInstanceMigration.UiTests/MinecraftInstanceMigration.UiTests.csproj
      - name: Run WPF UI smoke
        run: dotnet test tests/MinecraftInstanceMigration.UiTests/MinecraftInstanceMigration.UiTests.csproj --configuration Release --no-restore

  release-package:
    needs: [verify, ui-smoke]
    runs-on: windows-latest
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production-signing' || 'release-dry-run' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore packaged-application UI tests
        run: dotnet restore tests/MinecraftInstanceMigration.UiTests/MinecraftInstanceMigration.UiTests.csproj
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Inno Setup compiler checksum verification failed.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Inno Setup compiler signature verification failed.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "ISCC_PATH=$installDir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Cloud HSM signing client (DigiCert KeyLocker)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: ${{ vars.SM_HOST }}
          CERT_THUMBPRINT: ${{ vars.MIM_PRODUCTION_SIGNING_CERT_THUMBPRINT || secrets.MIM_PRODUCTION_SIGNING_CERT_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.MIM_PRODUCTION_SIGNING_TIMESTAMP_URL }}
        run: |
          if (-not $env:SM_API_KEY -or -not $env:SM_CLIENT_CERT_FILE_B64 -or -not $env:SM_CLIENT_CERT_PASSWORD -or -not $env:CERT_THUMBPRINT -or -not $env:TIMESTAMP_URL) {
            Write-Host 'Cloud HSM credentials not configured. Proceeding with unsigned community release.'
            "SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          "SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hostUrl = if ($env:SM_HOST) { $env:SM_HOST } else { 'https://clientauth.one.digicert.com' }
          $clientCertPath = Join-Path $env:RUNNER_TEMP 'sm_client_cert.p12'
          [IO.File]::WriteAllBytes($clientCertPath, [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64))
          "SM_CLIENT_CERT_FILE=$clientCertPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SM_HOST=$hostUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SM_API_KEY=$env:SM_API_KEY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SM_CLIENT_CERT_PASSWORD=$env:SM_CLIENT_CERT_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_CERT_THUMBPRINT=$env:CERT_THUMBPRINT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SIGNING_TIMESTAMP_URL=$env:TIMESTAMP_URL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $smToolsInstaller = Join-Path $env:RUNNER_TEMP 'smtools-windows-x64.msi'
          Invoke-WebRequest "https://one.digicert.com/signingmanager/api-ui/v1/releases/smtools-windows-x64.msi/download" `
            -Headers @{ 'x-api-key' = $env:SM_API_KEY } `
            -OutFile $smToolsInstaller
          $process = Start-Process msiexec.exe -ArgumentList @('/i', $smToolsInstaller, '/quiet', '/qn', '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "DigiCert One tools installation failed: $($process.ExitCode)" }

          $smkspBat = 'C:\Program Files\DigiCert\DigiCert One Signing Manager Tools\smksp_register.bat'
          if (-not (Test-Path -LiteralPath $smkspBat)) { throw 'DigiCert KSP register script was not found.' }
          $regProcess = Start-Process $smkspBat -Wait -PassThru
          if ($regProcess.ExitCode -ne 0) { throw "DigiCert KSP registration failed: $($regProcess.ExitCode)" }

          $smctl = 'C:\Program Files\DigiCert\DigiCert One Signing Manager Tools\smctl.exe'
          if (-not (Test-Path -LiteralPath $smctl)) { throw 'smctl.exe was not found.' }
          $env:SM_CLIENT_CERT_FILE = $clientCertPath
          $env:SM_HOST = $hostUrl
          & $smctl windows-cert sync
          if ($LASTEXITCODE -ne 0) { throw "DigiCert certificate sync failed: $LASTEXITCODE" }
      - name: Locate SignTool
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'SignTool was not found.' }
          "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and verify unsigned release artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.SIGNING_ENABLED != 'true' }}
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          ./eng/release/Build-Release.ps1 -IsccPath $env:ISCC_PATH -ExpectedVersion $version
      - name: Build and verify signed release artifacts
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          ./eng/release/Build-Release.ps1 `
            -IsccPath $env:ISCC_PATH `
            -ExpectedVersion $env:GITHUB_REF_NAME.Substring(1) `
            -RequireSigning `
            -SignToolPath $env:SIGNTOOL_PATH `
            -CertificateThumbprint $env:SIGNING_CERT_THUMBPRINT `
            -TimestampUrl $env:SIGNING_TIMESTAMP_URL
      - name: Remove temporary cloud signing authentication material
        if: always() && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SM_CLIENT_CERT_FILE)) {
            $temporaryRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP) + [System.IO.Path]::DirectorySeparatorChar
            $clientCert = [System.IO.Path]::GetFullPath($env:SM_CLIENT_CERT_FILE)
            if (-not $clientCert.StartsWith($temporaryRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Refusing to remove a client certificate outside the runner temporary directory.'
            }
            if (Test-Path -LiteralPath $clientCert -PathType Leaf) {
              Remove-Item -LiteralPath $clientCert -Force -ErrorAction Stop
            }
            if (Test-Path -LiteralPath $clientCert) {
              throw 'Temporary client certificate cleanup failed.'
            }
          }
      - name: Validate per-user install and uninstall
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $requireSigning = ($env:SIGNING_ENABLED -eq 'true')
          ./eng/release/Test-Installer.ps1 `
            -InstallerPath "artifacts/release/MinecraftInstanceMigrationTool-$version-win-x64-setup.exe" `
            -ExpectedVersion $version `
            -TestReinstall `
            -CreateDesktopShortcut `
            -RequireSigning:$requireSigning `
            -UseDefaultInstallPath
      - name: Validate clean-machine release package
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $requireSigning = ($env:SIGNING_ENABLED -eq 'true')
          ./eng/release/Validate-CleanMachine.ps1 `
            -ArtifactsRoot "$PWD/artifacts" `
            -ExpectedVersion $version `
            -RequireSigning:$requireSigning
      - name: Run migration smoke against extracted portable package
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $portableRoot = Join-Path $env:RUNNER_TEMP 'mim-release-candidate-portable'
          if (Test-Path -LiteralPath $portableRoot) { throw 'Portable validation directory already exists.' }
          Expand-Archive `
            -LiteralPath "artifacts/release/MinecraftInstanceMigrationTool-$version-win-x64.zip" `
            -DestinationPath $portableRoot
          $env:MIM_UI_EXECUTABLE = Join-Path $portableRoot 'MinecraftInstanceMigrationTool.exe'
          dotnet test tests/MinecraftInstanceMigration.UiTests/MinecraftInstanceMigration.UiTests.csproj `
            --configuration Release `
            --no-restore
      - name: Upload unsigned dry-run artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftInstanceMigrationTool-unsigned-dry-run-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload production signed artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftInstanceMigrationTool-production-signed-${{ github.run_id }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: MinecraftInstanceMigrationTool-production-signed-${{ github.run_id }}
          path: artifacts/release
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/release/* --draft --verify-tag --title $env:GITHUB_REF_NAME --notes-file docs/release-notes-template.md
